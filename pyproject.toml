[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanofetch"
version = "0.2.0"
description = "Ridiculously easy gene-region BAM extraction"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "nanofetch contributors"}]
keywords = ["bam", "bioinformatics", "genomics", "samtools", "t2t"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["pysam>=0.22"]

[project.urls]
Homepage = "https://github.com/AlexanderM-M/Nanofetch"
Repository = "https://github.com/AlexanderM-M/Nanofetch.git"
Issues = "https://github.com/AlexanderM-M/Nanofetch/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
nanofetch = "nanofetch.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nanofetch = ["data/*.json", "data/*.tsv.gz", "data/panels/*.txt"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
