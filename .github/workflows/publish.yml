name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Test and build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Test and build
        run: |
          python -m pip install build twine
          python -m pip install ".[test]"
          pytest
          python -m build
          python -m twine check dist/*
      - name: Smoke-test the built wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/nanofetch-*.whl
          python -m pip check
          nanofetch --version
          nanofetch --list-panels
          python -c "from nanofetch.annotations import resolve_gene; [resolve_gene('EGFR', assembly) for assembly in ('grch37', 'grch38', 't2t')]"
      - uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nanofetch
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
